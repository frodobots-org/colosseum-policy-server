[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "colosseum-policy-server"
version = "0.2.0"
description = "Pull-based policy inference SDK for Colosseum"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "protobuf>=5,<7",
  "PyYAML>=6,<7",
  "websockets>=15,<16",
]

[project.optional-dependencies]
dev = ["grpcio-tools>=1.66", "pytest>=8", "pytest-asyncio>=0.24"]
demo = ["opencv-python>=4.10,<5"]

[project.scripts]
colosseum-policy-demo = "colosseum_policy_server.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
